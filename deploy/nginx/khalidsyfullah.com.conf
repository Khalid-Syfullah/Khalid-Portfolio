# Nginx site for khalidsyfullah.com — static Next.js export served from releases.
# Installed by deploy/setup-server.sh as /etc/nginx/sites-available/khalidsyfullah.com
# Web root: /var/www/khalidsyfullah.com/current  (a symlink switched by GitHub Actions)
# TLS: Let's Encrypt (certbot) certificate for khalidsyfullah.com and www.khalidsyfullah.com
# Written for nginx 1.24 (Ubuntu 24.04): uses `listen ... ssl http2` rather than `http2 on`.

# HTTP → HTTPS (keeps the ACME challenge path working for certbot renewals)
server {
    listen 80;
    listen [::]:80;
    server_name khalidsyfullah.com www.khalidsyfullah.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://khalidsyfullah.com$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.khalidsyfullah.com;

    ssl_certificate     /etc/letsencrypt/live/khalidsyfullah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khalidsyfullah.com/privkey.pem;

    return 301 https://khalidsyfullah.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khalidsyfullah.com;

    ssl_certificate     /etc/letsencrypt/live/khalidsyfullah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khalidsyfullah.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/khalidsyfullah.com/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # Never serve dotfiles (checked before the other regex locations)
    location ~ /\. { deny all; }

    # Hashed build assets: cache for a year
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Images, fonts, résumé: cache for a week
    location ~* \.(?:avif|webp|jpe?g|png|svg|ico|woff2?|pdf)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Deploy health check: never cached
    location = /version.txt {
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Pages: always revalidate so a new deploy shows immediately
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

}
